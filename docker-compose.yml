services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sovereign_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: sovereign_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_sovereign_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sovereign_workbench"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    driver: local
